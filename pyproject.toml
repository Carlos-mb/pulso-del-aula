[project]
name = "pulso"
version = "0.1.0"
description = "Pulso del aula: sondeo anónimo de conocimientos en clase"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "segno>=1.5",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
pulso = "pulso.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulso*"]

[tool.setuptools.package-data]
pulso = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
